name: Refresh and deploy

on:
  schedule:
    - cron: "23 */3 * * *"   # new pro games every 3 hours
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    # code pushes build right away instead of queueing behind a long scrape; scrapes never overlap each other
    concurrency:
      group: build-${{ github.event_name == 'push' && 'code' || 'data' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # gol.gg outages or throttling must not block a deploy of what we already have
      - name: Scrape new games
        if: github.event_name != 'push'
        continue-on-error: true
        run: python pipeline/scrape.py
      - name: Backfill per-game extras (gold, timeline, builds), time-boxed
        if: github.event_name != 'push'
        continue-on-error: true
        working-directory: pipeline
        run: python extras.py --minutes 40
      - name: Official broadcast VODs (lolesports), time-boxed
        if: github.event_name != 'push'
        continue-on-error: true
        run: python pipeline/vods.py --minutes 8
      - name: Dota 2 pro matches (OpenDota, ~3k calls/day), time-boxed
        if: github.event_name != 'push'
        continue-on-error: true
        run: python pipeline/dota.py --minutes 15
      - name: VALORANT VCT (Liquipedia, only changed pages; Riot logos + VODs), time-boxed
        if: github.event_name != 'push'
        continue-on-error: true
        run: python pipeline/val.py --minutes 15
      - name: Counter-Strike 2 S-Tier (Liquipedia, only changed pages; Valve VRS), time-boxed
        if: github.event_name != 'push'
        continue-on-error: true
        run: python pipeline/cs.py --minutes 15
      - name: Commit new games
        if: github.event_name != 'push'
        run: |
          git config user.name "rift-ledger-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then git pull --rebase -q origin main; exit 0; fi
          git commit -m "New games $(date -u +%FT%H:%MZ)"
          # someone may have pushed code while we scraped; the bot only touches data/, so rebasing is safe
          for i in 1 2 3; do git pull --rebase -q origin main && git push && exit 0; sleep 10; done
          exit 1
      # build after the rebase so a data run deploys the latest code, not the code it started with
      - name: Build
        run: python pipeline/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
